name: Build APK

# Releases are built and signed LOCALLY (with the app's stable keystore, which is
# intentionally not committed to this public repo), then uploaded to a GitHub release.
# That keeps every published APK on the same signature so in-app updates install cleanly.
#
# A CI build here would sign with a freshly generated, throwaway keystore and break that
# signature chain, so this workflow no longer runs on tags and does not create releases.
# It only builds a (differently-signed, debug-only) artifact on manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk
