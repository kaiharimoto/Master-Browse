name: Build APK

# Builds the release APK on manual dispatch. If a `tag` input is given, it also
# creates a GitHub release with the APK attached (notes come from
# .github/release-notes.md).
#
# Signing: the stable keystore is committed at app/release.keystore (deliberate
# tradeoff for this personal app — see README), so every build signs identically
# and in-app updates install cleanly. A RELEASE_KEYSTORE_B64 repo secret, if
# ever set, takes precedence by overwriting that file before the build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3). Empty = build artifact only, no release."
        required: false
        default: ""
      versionCode:
        description: "Android versionCode for this build (integer, must increase each release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable keystore from secret (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "Restored stable keystore from RELEASE_KEYSTORE_B64 secret."
          else
            echo "No RELEASE_KEYSTORE_B64 secret set; a fresh keystore will be generated (new signature)."
          fi

      - name: Run unit tests and build release APK
        run: |
          ARGS=""
          [ -n "${{ inputs.versionCode }}" ] && ARGS="$ARGS -PversionCode=${{ inputs.versionCode }}"
          [ -n "${{ inputs.tag }}" ] && ARGS="$ARGS -PversionName=${{ inputs.tag }}"
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon $ARGS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "master-browse-${{ inputs.tag }}.apk"
          gh release create "${{ inputs.tag }}" "master-browse-${{ inputs.tag }}.apk" \
            --target "$GITHUB_SHA" \
            --title "Master Browse ${{ inputs.tag }}" \
            --notes-file .github/release-notes.md
